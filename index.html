<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#16131d"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Storyloom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Layout: drawer sidebar (persistent ≥900px) + full-height chat column; every color is a user-editable token */
:root{
  --bg:#16131d; --surface:#211d2b; --surface2:#2b2638; --border:#3b344a;
  --text:#e9e4f1; --muted:#9e96b0; --accent:#c9a46a; --accentText:#1b1622;
  --userBubble:#2d2a40; --charBubble:#1f1b29; --italics:#b9abd9; --quote:#f1cf8f; --bold:#ffffff;
  --font-ui:"Manrope",system-ui,sans-serif; --font-chat:"Literata",Georgia,serif; --fs:16px;
  --bubbleAlpha:0.92; --radius:14px;
  --bgImage:none; --sidebarImage:none; --headerImage:none; --buttonImage:none; --sendImage:none;
  --dim:0.55;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{display:grid;grid-template-columns:1fr;height:100%;position:relative}
@media (min-width:900px){#app{grid-template-columns:300px 1fr}}

/* ---------- sidebar ---------- */
#sidebar{background:var(--surface);background-image:var(--sidebarImage);background-size:cover;background-position:center;
  display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);
  padding-left:env(safe-area-inset-left,0px)}
@media (max-width:899px){
  #sidebar{position:fixed;inset:0 auto 0 0;width:min(86vw,330px);z-index:40;transform:translateX(-102%);transition:transform .22s ease;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  #sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
}
.sb-inner{display:flex;flex-direction:column;gap:12px;padding:16px 14px 10px;min-height:0;flex:1}
.brand{font-family:var(--font-chat);font-size:22px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accentText);display:grid;place-items:center;font-size:15px}
#chatSearch{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg)}
#chatList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -6px;padding:0 6px;min-height:0}
.chat-item{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:10px;border:0;background:transparent;text-align:left;width:100%}
.chat-item:hover{background:color-mix(in srgb,var(--surface2) 70%,transparent)}
.chat-item.active{background:var(--surface2)}
.chat-item .meta{min-width:0;flex:1}
.chat-item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 2px 0}
.sb-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 14px 14px;border-top:1px solid var(--border)}
.sb-nav button{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px}
.sb-nav svg{width:18px;height:18px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.show{opacity:1;pointer-events:auto}
@media (min-width:900px){#scrim{display:none}}

/* ---------- main ---------- */
#main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;
  background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,0)),var(--bg)}
#main::before{content:"";position:absolute;inset:0;background-image:var(--bgImage);background-size:cover;background-position:center;opacity:calc(1 - var(--dim));pointer-events:none}
#main>*{position:relative}
#topbar{display:flex;align-items:center;gap:8px;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 88%,transparent);background-image:var(--headerImage);background-size:cover;background-position:center;
  border-bottom:1px solid var(--border);backdrop-filter:blur(8px);min-height:58px}
@media (min-width:900px){#topbar{padding-left:16px}}
.iconbtn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:22px;height:22px}
@media (min-width:900px){#menuBtn{display:none}}
.titlebox{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:4px;border-radius:10px}
.titlebox .tt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebox .st{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebox>div{min-width:0}
.swap{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:3px 10px 3px 3px;flex:none;max-width:44%}
.swap span{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swap svg{width:14px;height:14px;flex:none;color:var(--muted)}

.av{width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;background:var(--surface2);display:grid;place-items:center;font-weight:700;color:var(--accentText);font-size:15px;overflow:hidden}
.av.sm{width:30px;height:30px;font-size:13px}
.av.lg{width:84px;height:84px;font-size:30px}
.av img{width:100%;height:100%;object-fit:cover}

#messages{flex:1;overflow-y:auto;padding:18px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.inner{max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.msg .col{min-width:0;max-width:min(680px,88%);display:flex;flex-direction:column;gap:4px}
.msg.user .col{align-items:flex-end}
.msg .name{font-size:12.5px;color:var(--muted);font-weight:600;padding:0 4px}
.bubble{font-family:var(--font-chat);font-size:var(--fs);line-height:1.6;color:var(--text);padding:11px 15px;border-radius:var(--radius);
  background:color-mix(in srgb,var(--charBubble) calc(var(--bubbleAlpha)*100%),transparent);border:1px solid color-mix(in srgb,var(--border) 60%,transparent);overflow-wrap:anywhere}
.msg.user .bubble{background:color-mix(in srgb,var(--userBubble) calc(var(--bubbleAlpha)*100%),transparent)}
.flat .bubble{background:transparent;border-color:transparent;padding:4px 2px}
.flat .msg.user{flex-direction:row}.flat .msg.user .col{align-items:flex-start}
.bubble p{margin:0 0 .7em}.bubble p:last-child{margin:0}
.bubble .it{color:var(--italics);font-style:italic}
.bubble .q{color:var(--quote)}
.bubble b{color:var(--bold)}
.bubble .it .q{color:var(--quote)}
.bubble.streaming::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.thinking{display:inline-flex;gap:4px}.thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bob 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.bubble.streaming::after,.thinking i{animation:none}#sidebar{transition:none}}
.actions{display:none;gap:2px;flex-wrap:wrap}
.msg.show-actions .actions{display:flex}
@media (hover:hover){.msg:hover .actions{display:flex}}
.actions button{border:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:12.5px;padding:4px 9px;color:var(--muted);display:flex;align-items:center;gap:4px}
.actions button:hover{color:var(--text)}
.actions svg{width:13px;height:13px}
.edit-area{width:min(680px,80vw);min-height:120px;font-family:var(--font-chat);font-size:var(--fs);line-height:1.55;background:var(--bg);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;resize:vertical}
.edit-row{display:flex;gap:6px;justify-content:flex-end}

.empty{margin:auto;text-align:center;max-width:380px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;padding:30px 16px}
.empty h2{color:var(--text);font-family:var(--font-chat);font-weight:600;margin:0;font-size:24px}

#composer{padding:8px max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 90%,transparent);border-top:1px solid var(--border);backdrop-filter:blur(8px)}
.comp{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
#input{flex:1;resize:none;max-height:40vh;min-height:44px;padding:11px 14px;border-radius:14px;border:1px solid var(--border);background:var(--bg);font-family:var(--font-chat);font-size:var(--fs);line-height:1.4}
#sendBtn{width:46px;height:46px;border-radius:14px;border:0;background:var(--accent);background-image:var(--sendImage);background-size:cover;background-position:center;color:var(--accentText);display:grid;place-items:center;flex:none}
#sendBtn svg{width:22px;height:22px}
#sendBtn.has-img svg{opacity:0}
.comp-hint{max-width:820px;margin:0 auto 6px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.comp-hint button{border:0;background:transparent;color:var(--accent);padding:0;font-size:12px;font-weight:600}

/* ---------- buttons, fields ---------- */
.btn{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);background-image:var(--buttonImage);background-size:cover;background-position:center;color:var(--accentText);border-color:transparent}
.btn.danger{color:#ff8f8f;border-color:color-mix(in srgb,#ff8f8f 40%,var(--border))}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.field .help{font-size:12.5px;color:var(--muted);line-height:1.45}
.field input[type=text],.field input[type=password],.field input[type=number],.field select,.field textarea{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg)}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.field textarea.tall{min-height:220px;font-family:ui-monospace,"JetBrains Mono",monospace;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
@media (min-width:700px){#sheet{align-items:center}}
.sheet-panel{background:var(--surface);width:100%;max-width:640px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;border:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet-panel{border-radius:18px;max-height:88%}}
.sheet-head{flex:none;display:flex;align-items:center;gap:6px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--border)}
.sheet-head h3{margin:0;font-size:17px;flex:1;font-family:var(--font-chat);font-weight:600}
.sheet-body{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.tabs{flex:none;display:flex;gap:4px;overflow-x:auto;padding:8px 12px 0;border-bottom:1px solid var(--border)}
.tabs button{border:0;background:transparent;padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--bg);text-align:left;width:100%}
.li .meta{flex:1;min-width:0}
.li .t{font-weight:700}
.li .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.li.on{border-color:var(--accent)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pill.acc{background:var(--accent);color:var(--accentText)}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.color{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:13px}
.color input{width:32px;height:28px;border:0;padding:0;background:transparent;flex:none}
.imgslot{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
.imgslot .thumb{width:54px;height:40px;border-radius:6px;background:var(--surface2) center/cover;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);color:var(--accent)}
.preview-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;line-height:1.5;max-height:50vh;overflow:auto}
.note{font-size:13px;color:var(--muted);line-height:1.5;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--border)}
.section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-top:6px}
input[type=range]{width:100%;accent-color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;max-width:min(92vw,520px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#confirmBox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
#confirmBox .box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
#confirmBox p{margin:0;line-height:1.5}
</style>

<div id="app">
  <aside id="sidebar" aria-label="Chats">
    <div class="sb-inner">
      <div class="row" style="justify-content:space-between">
        <div class="brand"><span class="mark">✶</span>Storyloom</div>
      </div>
      <button id="newChatBtn" class="btn primary" type="button">＋ New chat</button>
      <input id="chatSearch" type="search" placeholder="Search chats" aria-label="Search chats">
      <div class="sb-label">Chats</div>
      <div id="chatList"></div>
    </div>
    <nav class="sb-nav">
      <button type="button" data-open="characters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="7" r="2.5"/><path d="M17 12.5c2.3 0 4 1.4 4.6 4"/></svg>Characters</button>
      <button type="button" data-open="personas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v6a7 7 0 0 1-14 0z"/><path d="M8.5 9.5h2M13.5 9.5h2M9.5 13c1.5 1 3.5 1 5 0"/></svg>Personas</button>
      <button type="button" data-open="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
    </nav>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <header id="topbar">
      <button id="menuBtn" class="iconbtn" type="button" aria-label="Open chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button id="titleBox" class="titlebox" type="button" aria-label="Chat settings"><div><div class="tt" id="chatTitle">Storyloom</div><div class="st" id="chatSub"></div></div></button>
      <button id="swapBtn" class="swap" type="button" aria-label="Swap character" hidden></button>
      <button id="chatSettingsBtn" class="iconbtn" type="button" aria-label="Chat settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </header>
    <div id="messages"><div class="inner" id="msgInner"></div></div>
    <div id="composer">
      <div class="comp-hint" id="compHint"></div>
      <div class="comp">
        <textarea id="input" rows="1" placeholder="Write your turn…  *actions*  &quot;dialogue&quot;" aria-label="Message"></textarea>
        <button id="sendBtn" type="button" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </main>
</div>
<div id="sheet" hidden><div class="sheet-panel" role="dialog" aria-modal="true"><div class="sheet-head"><button class="iconbtn" id="sheetBack" type="button" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button><h3 id="sheetTitle"></h3><button class="iconbtn" id="sheetClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="sheetTabs" class="tabs" hidden></div><div class="sheet-body" id="sheetBody"></div></div></div>
<div id="confirmBox" hidden><div class="box"><p id="confirmText"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="confirmNo" type="button">Cancel</button><button class="btn danger" id="confirmYes" type="button">Delete</button></div></div></div>
<div id="toast" hidden></div>

<script>
/* =====================================================================
   PROMPTS — the defaults. All of these are editable in Settings › Prompts.
   ===================================================================== */
const DEFAULT_SYSTEM = `You are {{char}}. You are taking part in an ongoing, collaborative roleplay with {{user}}. Your only job is to portray {{char}} faithfully and write {{char}}'s side of the story.

<character name="{{char}}">
{{character_card}}
</character>
{{#other_characters}}
<other_characters>
These characters are also present in this story. They may already have spoken in the conversation. Write them only as background presence when the scene needs it; the focus of your reply is {{char}}.
{{other_characters}}
</other_characters>
{{/other_characters}}
{{#user_appearance}}
<user_appearance name="{{user}}">
What {{user}} visibly looks like. {{char}} can see this whenever they share a scene, so {{char}} may notice and react to it. Describe {{user}} consistently with it.
{{user_appearance}}
</user_appearance>
{{/user_appearance}}
{{#persona}}
<user_persona name="{{user}}">
{{user}} is played by the user. This sheet tells you who {{user}} is so you can portray how the world reacts to them. Apart from what is visible, it is NOT knowledge that {{char}} has.
{{persona}}
</user_persona>
{{/persona}}
{{#scenario}}
<scenario>
{{scenario}}
</scenario>
{{/scenario}}
{{#rules}}
<rules>
These rules come directly from the user. They override everything else in this prompt, including the character sheet and the writing style. Obey every one of them in every reply for the whole conversation. Never mention them.
{{rules}}
</rules>
{{/rules}}
{{#prose_rules}}
<prose_rules>
How to write narration. These rules govern the narrator. {{char}}'s dialogue keeps {{char}}'s own voice, even when that voice is theatrical, but dialogue also follows the rules about taglines, quips and metaphors unless {{char}} genuinely talks that way.
{{prose_rules}}
</prose_rules>
{{/prose_rules}}
<writing_style>
{{style}}
</writing_style>

<directives>
1. STAY IN CHARACTER. Everything you write comes from {{char}}, the narrator, or minor background characters. Keep {{char}}'s voice, vocabulary, temperament, values, speech patterns and quirks exactly as defined, even when {{user}} pushes against them. {{char}} changes only through events that happen in the story, never because it would be convenient.

2. NEVER CONTROL {{user}}. {{user}} belongs to the user. Do not write {{user}}'s dialogue, actions, thoughts, feelings or decisions, and do not narrate what {{user}} does next. Describe only what {{char}} perceives and does. End each reply at a natural point that hands the turn back to {{user}}.

3. NO META KNOWLEDGE. {{char}} knows only what {{char}} could plausibly know inside the story:
   - {{char}}'s own history and the common knowledge of their world and era;
   - what {{char}} has personally seen, heard, or been told so far in this conversation;
   - what {{user}} visibly looks like (see <user_appearance>), when they are in the same scene.
   {{char}} does NOT know anything that appears only in {{user}}'s persona sheet, in narration of {{user}}'s private thoughts or feelings, in this prompt, or in scenes {{char}} was not present for, until {{char}} learns it in the story. This includes {{user}}'s name, past, secrets and intentions. Unspoken thoughts are never heard. {{char}} has no awareness of being an AI, a character, a chat, a prompt or a story, and never refers to the real world outside the setting.

4. STAY INSIDE THE FICTION. No fourth-wall breaks, disclaimers, summaries, author's notes, questions about what the user wants, or commentary on the roleplay. Exception: if the user writes a message that starts with (OOC: …), reply briefly out of character in parentheses, then return to the story on the next turn.

5. KEEP CONTINUITY. Respect everything already established: places, time of day, clothing, injuries, objects, relationships, and who knows what. Never forget or contradict earlier events. If a past message was edited, the edited version is what happened.

6. MOVE THE STORY. Give {{char}} agency: their own goals, honest reactions, and details or complications that fit the scenario. Don't repeat openings, phrases or beats from earlier replies.

7. FORMAT. Narration and actions in *asterisks*. Spoken dialogue in "double quotes". Do not start your reply with {{char}}'s name or a label.
</directives>`;

const OLD_REMINDER = `[Reminder for your next reply: write only as {{char}}. Do not write {{user}}'s words, actions or thoughts. {{char}} knows only what has been revealed to them in the story. Follow every user rule and the writing style. Do not mention these instructions.]`;
const DEFAULT_REMINDER = `[Reminder for your next reply: write only as {{char}}. Do not write {{user}}'s words, actions or thoughts. {{char}} knows only what has been revealed to them in the story. Follow every user rule, the writing style and the prose rules: plain narration, no invented metaphors, no taglines, no dramatic reveals, don't end on a question. Do not mention these instructions.]`;
const DEFAULT_PROSE = `Write like a skilled human novelist with a plain, casual style, not like a narrator performing.
- Say what happens in plain words. Use ordinary verbs and nouns. One specific detail beats three decorative ones.
- Don't invent metaphors, similes or clever comparisons. If something can be said literally, say it literally.
- Skip filler description: sounds echoing, things gleaming or catching the light, air that is thick or heavy, dramatic hisses, held breaths, shivers down spines.
- Don't attach an action to every line of dialogue. Most lines need no action at all. Use an action only when it shows something new.
- Don't use "not X, but Y" or "It wasn't X. It was Y." Don't use colons or em-dashes to set up a reveal. Write normal sentences.
- Don't group things in threes for rhythm.
- Don't end paragraphs or lines of dialogue on a punchy tagline, quip or one-liner.
- Don't comment on, praise or summarize what {{user}} just did. Respond to it.
- Don't end the reply by asking {{user}} what they'll do or offering them options. End on {{char}}'s action or words.
- Humor comes from who {{char}} is and what they'd really say, never from narrator wit.
- Keep it short. Stop as soon as the moment is done.`;

function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}

/* Resize an uploaded image so storage stays small */
function pickImage(maxDim,type="jpeg"){return new Promise(res=>{const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return res(null);
    if(f.type==="image/gif"&&f.size<1.5e6){const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);return}
    const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let{width:w,height:h}=img;const s=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL(type==="png"?"image/png":"image/jpeg",0.86))};img.onerror=()=>res(null);img.src=r.result};r.readAsDataURL(f)};
  inp.click()})}

const Store = {
  db:null, ok:false,
  open(){return new Promise(res=>{try{const r=indexedDB.open("storyloom",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");
    r.onsuccess=()=>{this.db=r.result;this.ok=true;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
  get(k){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})},
  set(k,v){return new Promise(res=>{if(!this.db)return res(false);try{const tx=this.db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}
};

let S;

function fixPrompts(pr){
  const d=defaultState().prompts;pr={...d,...pr};
  if(!pr.system.includes("{{prose_rules}}")){
    const blk=DEFAULT_SYSTEM.match(/\{\{#prose_rules\}\}[\s\S]*?\{\{\/prose_rules\}\}\n/)[0];
    pr.system=pr.system.includes("<writing_style>")?pr.system.replace("<writing_style>",blk+"<writing_style>"):pr.system+"\n\n"+blk;
  }
  if(pr.prose===undefined)pr.prose=DEFAULT_PROSE;
  if(pr.reminder===OLD_REMINDER)pr.reminder=DEFAULT_REMINDER;
  if(pr.style===`Third person, present tense, from {{char}}'s side of the scene. 2–4 paragraphs. Concrete sensory detail; show emotion through action, body language and subtext instead of naming it. Dialogue sounds like {{char}}, not like a narrator.`)pr.style=STYLE_PRESETS["Immersive"];
  if(!pr.system.includes("{{user_appearance}}")){
    const blk=DEFAULT_SYSTEM.match(/\{\{#user_appearance\}\}[\s\S]*?\{\{\/user_appearance\}\}\n/)[0];
    pr.system=pr.system.includes("{{#persona}}")?pr.system.replace("{{#persona}}",blk+"{{#persona}}"):pr.system+"\n\n"+blk;
  }
  return pr;
}
function migrate(s){const d=defaultState();
  s.settings={...d.settings,...s.settings};s.theme={...d.theme,...s.theme};
  s.characters??=[];s.personas??=[];s.chats??=[];
  s.prompts=fixPrompts(s.prompts||{});
  if(!Array.isArray(s.presets)||!s.presets.length){
    const st=clone(s.settings);for(const k of PRESET_SKIP)delete st[k];
    s.presets=[{id:uid(),name:"Default",settings:st,prompts:clone(s.prompts),updated:Date.now()}];s.activePresetId=s.presets[0].id;
  }
  if(!s.presets.some(p=>p.id===s.activePresetId))s.activePresetId=s.presets[0].id;
  if(s.settings.provider==="builtin"&&!HAS_CLAUDE)s.settings.provider="openrouter";
  return s}

  const l=document.createElement("link");l.rel="stylesheet";l.href=`https://fonts.googleapis.com/css2?family=${fam}:ital,wght@0,400;0,600;0,700;1,400&display=swap`;

  document.head.appendChild(l)}
function fontStack(n,serif){if(!n||n==="System")return serif?"Georgia,'Times New Roman',serif":"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif";return`"${n}",${serif?"Georgia,serif":"system-ui,sans-serif"}`}
function applyTheme(){const t=S.theme,r=document.documentElement.style;
  for(const[k]of THEME_KEYS)r.setProperty("--"+k,t[k]);

  r.setProperty("--fs",t.fontSize+"px");r.setProperty("--bubbleAlpha",t.bubbleAlpha);r.setProperty("--dim",t.bgImage?t.dim:1);
  for(const[k]of IMG_SLOTS)r.setProperty("--"+k,t[k]?`url("${t[k]}")`:"none");

/* =====================================================================
   MESSAGE FORMATTING: *italics*, "dialogue", **bold**
   ===================================================================== */
function fmt(src){
  let h=esc(src);
  h=h.replace(/\*\*([^*\n]+?)\*\*/g,"<b>$1</b>");
  h=h.replace(/\*([^*\n]+?)\*/g,"<i class='it'>$1</i>");
  h=h.replace(/"([^"\n]+?)"/g,"<span class='q'>\"$1\"</span>");
  h=h.replace(/“([^”\n]+?)”/g,"<span class='q'>“$1”</span>");
  return h.split(/\n{2,}/).map(p=>"<p>"+p.replace(/\n/g,"<br>")+"</p>").join("");
}

/* =====================================================================
   PROMPT ASSEMBLY
   ===================================================================== */
function renderTemplate(tpl,ctx){
  let out=tpl.replace(/\{\{#(\w+)\}\}([\s\S]*?)\{\{\/\1\}\}/g,(_,k,inner)=>(ctx[k]&&String(ctx[k]).trim())?inner:"");
  out=out.replace(/\{\{(\w+)\}\}/g,(m,k)=>k in ctx?ctx[k]:m);
  return out.replace(/\n{3,}/g,"\n\n").trim();
}
function macro(s,charName,userName){return String(s||"").replace(/\{\{char\}\}/gi,charName).replace(/\{\{user\}\}/gi,userName)}
function buildRequest(chat,char,history){
  const persona=getPersona(chat.personaId)||{name:"User",description:""};
  const U=persona.name||"User",C=char.name;
  const card=[`Name: ${C}`,char.description&&`Description:\n${char.description}`,char.personality&&`Personality:\n${char.personality}`,
    char.examples&&`Example dialogue (shows ${C}'s voice only; these exchanges did not happen in this story):\n${char.examples.replace(/<START>/gi,"---")}`].filter(Boolean).join("\n\n");
  const others=chat.characterIds.filter(id=>id!==char.id).map(getChar).filter(Boolean).map(o=>`- ${o.name}: ${(o.description||"").replace(/\s+/g," ").slice(0,700)}${o.personality?" Personality: "+o.personality.replace(/\s+/g," ").slice(0,300):""}`).join("\n");
  const rules=[S.prompts.rules,chat.rules].map(r=>(r||"").trim()).filter(Boolean).join("\n");
  const style=(chat.style||"").trim()||S.prompts.style;
  const ctx={char:C,user:U,character_card:card,other_characters:others,persona:persona.description||"",user_appearance:persona.appearance||"",scenario:chat.scenario||"",rules,style,prose_rules:S.prompts.prose||""};
  // render twice so {{char}}/{{user}} inside inserted fields are also resolved
  const system=macro(renderTemplate(S.prompts.system,ctx),C,U);
  const reminder=macro(S.prompts.reminder,C,U).trim();

  const limit=Math.max(4,+S.settings.contextLimit||80);
  const hist=history.slice(-limit);
  const turns=[];
  for(const m of hist){
    let role,content;
    if(m.role==="user"){role="user";content=m.content}
    else if(m.charId===char.id){role="assistant";content=m.content}
    else{role="user";content=`[${getChar(m.charId)?.name||"Another character"}]\n${m.content}`}
    if(!content.trim())continue;
    const last=turns[turns.length-1];
    if(last&&last.role===role)last.content+="\n\n"+content;else turns.push({role,content});
  }
  if(!turns.length||turns[0].role!=="user")turns.unshift({role:"user",content:`[The scene begins. ${U} is present.]`});
  if(turns[turns.length-1].role==="assistant")turns.push({role:"user",content:`[Continue the scene as ${C}.]`});
  if(reminder)turns[turns.length-1].content+="\n\n"+reminder;
  return{system,turns,charName:C,userName:U};
}

const PROVIDERS={
  builtin:{label:"Claude (built-in)",note:"Uses your Claude account through this page. Only works while the app is opened inside Claude."},
  openrouter:{label:"OpenRouter",baseUrl:"https://openrouter.ai/api/v1",model:"anthropic/claude-sonnet-4.5",kind:"openai",note:"One key, hundreds of models. Get a key at openrouter.ai/keys."},
  openai:{label:"OpenAI",baseUrl:"https://api.openai.com/v1",model:"gpt-4o",kind:"openai"},
  anthropic:{label:"Anthropic",baseUrl:"https://api.anthropic.com",model:"claude-sonnet-5-5",kind:"anthropic",note:"Get a key at console.anthropic.com."},
  nvidia:{label:"NVIDIA NIM",baseUrl:"https://integrate.api.nvidia.com/v1",model:"meta/llama-3.3-70b-instruct",kind:"openai",native:true,note:"Get a key (starts with nvapi-) at build.nvidia.com. Pick a model there and copy its name, like meta/llama-3.3-70b-instruct. NVIDIA blocks browser requests, so this only works in the Android app, using the direct connection below."},
  custom:{label:"Custom (OpenAI-compatible)",baseUrl:"http://localhost:1234/v1",model:"",kind:"openai",note:"Any OpenAI-compatible server: LM Studio, Ollama (/v1), KoboldCpp, Together, DeepSeek, Groq, etc."}
};
/* Native HTTP (Android app only): skips the browser's cross-site (CORS) block. No live streaming. */
const NativeHttp=IS_NATIVE?window.Capacitor?.Plugins?.CapacitorHttp:null;
async function post(url,headers,bodyObj,signal,useNative){
  if(useNative&&NativeHttp){
    const r=await NativeHttp.request({url,method:"POST",headers,data:{...bodyObj,stream:false},responseType:"json",connectTimeout:30000,readTimeout:300000});
    if(signal?.aborted)throw new DOMException("Aborted","AbortError");
    const data=typeof r.data==="string"?(()=>{try{return JSON.parse(r.data)}catch(e){return{error:{message:r.data}}}})():r.data;
    return{ok:r.status>=200&&r.status<300,status:r.status,native:true,json:async()=>data,text:async()=>JSON.stringify(data)};
  }
  return fetch(url,{method:"POST",signal,headers,body:JSON.stringify(bodyObj)});
}
async function readSSE(res,onData,signal){
  const reader=res.body.getReader(),dec=new TextDecoder();let buf="";
  while(true){if(signal?.aborted)break;const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).replace(/\r$/,"");buf=buf.slice(i+1);
      if(!line.startsWith("data:"))continue;const d=line.slice(5).trim();if(!d||d==="[DONE]")continue;try{onData(JSON.parse(d))}catch(e){}}}
}
async function errText(res){let t="";try{t=await res.text();if(res.native&&t.length>300)t=t.slice(0,300);const j=JSON.parse(t);t=j.error?.message||j.message||j.error||t}catch(e){}return`${res.status} ${typeof t==="string"?t.slice(0,300):""}`}
async function callModel({system,turns},onText,signal){
  const st=S.settings,P=PROVIDERS[st.provider]||PROVIDERS.custom;
  if(st.provider==="builtin"){
    const sample=await window.claude.use("sample");
    if(!sample)throw new Error("Built-in Claude isn't available here. Choose another provider in Settings › Connection.");
    const input=clone(turns);input[0].content=`<roleplay_instructions>\n${system}\n</roleplay_instructions>\n\n${input[0].content}`;
    try{const r=await sample(input,{cache:false,signal,onText:({text})=>onText(text)});return r.text}
    catch(e){if(e?.code==="not_granted")throw new Error("Claude access wasn't allowed for this page.");if(e?.code==="rate_limited")throw new Error("Too many requests. Wait a moment and try again.");if(e?.text)return e.text;throw new Error(e?.message||String(e))}
  }
  if(!st.apiKey&&st.provider!=="custom")throw new Error("NO_KEY");
  if(!st.model)throw new Error("Set a model name in Settings › Connection.");
  const base=st.baseUrl.replace(/\/+$/,"");
  let full="";
  const useNative=!!(st.nativeHttp&&NativeHttp);
  if(st.nativeHttp&&!NativeHttp&&!IS_NATIVE&&st.provider==="nvidia")throw new Error("NVIDIA only works in the Android app. In the browser, use OpenRouter or another provider.");
  if(P.kind==="anthropic"){
    const res=await post(base+"/v1/messages",{"content-type":"application/json","x-api-key":st.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      {model:st.model,system,messages:turns,max_tokens:+st.maxTokens||700,temperature:+st.temperature,stream:!!st.stream,...samplerExtras(st,"anthropic")},signal,useNative);
    if(!res.ok)throw new Error(await errText(res));
    if(!st.stream||res.native){const j=await res.json();full=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");onText(full);return full}
    await readSSE(res,ev=>{if(ev.type==="content_block_delta"&&ev.delta?.text){full+=ev.delta.text;onText(full)}else if(ev.type==="error")throw new Error(ev.error?.message)},signal);
    return full;
  }
  const headers={"content-type":"application/json"};if(st.apiKey)headers.authorization="Bearer "+st.apiKey;
  if(st.provider==="openrouter"){headers["HTTP-Referer"]="https://storyloom.app";headers["X-Title"]="Storyloom"}
  const reqBody={model:st.model,messages:[{role:"system",content:system},...turns],temperature:+st.temperature,max_tokens:+st.maxTokens||700,stream:!!st.stream};
  if(st.reasoning)reqBody.reasoning_effort=st.reasoning;
  Object.assign(reqBody,samplerExtras(st,"openai"));
  const t0=Date.now();const log=x=>{S.lastLog={when:new Date().toLocaleTimeString(),url:base+"/chat/completions",model:st.model,direct:useNative,secs:((Date.now()-t0)/1000).toFixed(1),...x};save()};
  let res;
  try{res=await post(base+"/chat/completions",headers,reqBody,signal,useNative)}catch(e){if(e?.name!=="AbortError")log({status:"no response",detail:String(e?.message||e)});throw e}
  if(!res.ok){const et=await errText(res);log({status:res.status,detail:et});throw new Error(et)}
  let thought="",finish="";
  if(!st.stream||res.native){const j=await res.json();const msg=j.choices?.[0]?.message||{};full=msg.content||"";thought=msg.reasoning_content||msg.reasoning||"";finish=j.choices?.[0]?.finish_reason||"";onText(full)}
  else await readSSE(res,ev=>{if(ev.error)throw new Error(ev.error.message||"Stream error");const c=ev.choices?.[0];const d=c?.delta?.content;const r=c?.delta?.reasoning_content||c?.delta?.reasoning;
    if(r){thought+=r;if(gen)gen.reasoning=true}if(c?.finish_reason)finish=c.finish_reason;if(d){full+=d;onText(full)}},signal);
  log({status:res.status,detail:`finish: ${finish||"?"} · reply ${visible(full).length} chars${thought?` · thinking ${thought.length} chars`:""}`+(visible(full)?"":"\nRaw: "+JSON.stringify(full).slice(0,200))});
  if(!visible(full)&&(thought||finish==="length"))throw new Error(`The model used up all ${reqBody.max_tokens} tokens ${thought?"thinking":""} before writing a reply. Raise "Max reply tokens" or lower "Reasoning effort" in Settings › Connection.`);
  return full;
}
function samplerExtras(st,kind){const x={};const num=v=>v!==""&&v!=null&&!isNaN(+v);
  if(kind!=="anthropic"){if(num(st.topP))x.top_p=+st.topP;if(num(st.freqPen))x.frequency_penalty=+st.freqPen;if(num(st.presPen))x.presence_penalty=+st.presPen}
  if(st.extraBody&&st.extraBody.trim()){let e;try{e=JSON.parse(st.extraBody)}catch(err){throw new Error("Extra request parameters isn't valid JSON. Fix it in Settings › Connection.")}if(e&&typeof e==="object")Object.assign(x,e)}
  return x}
function cleanOutput(t,charName,userName){
  let s=visible(t);
  s=s.replace(new RegExp("^\\s*\\[?"+charName.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\]?\\s*:\\s*","i"),"");
  // cut if the model starts writing the user's turn
  const u=userName.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const cut=s.search(new RegExp("\\n\\s*\\[?"+u+"\\]?\\s*:","i"));if(cut>0)s=s.slice(0,cut);
  return s.replace(/\s+$/,"");
}

/* =====================================================================
   GENERATION
   ===================================================================== */
async function generate(mode="new",targetId){
  const chat=getChat();if(!chat||gen)return;
  const char=getChar(chat.activeCharId);
  if(!char){toast("Pick a character to reply first.");swapSheet();return}
  let target,prev="",history;
  if(mode==="regen"){
    target=chat.messages.find(m=>m.id===targetId);prev=target.content;target.charId=char.id;target.content="";
    history=chat.messages.slice(0,chat.messages.indexOf(target));
  }else if(mode==="cont"){
    target=chat.messages.find(m=>m.id===targetId);prev=target.content;history=chat.messages.slice(0,chat.messages.indexOf(target)+1);
  }else{
    history=[...chat.messages];target={id:uid(),role:"char",charId:char.id,content:"",ts:Date.now()};chat.messages.push(target);
  }
  const charForReq=mode==="cont"?(getChar(target.charId)||char):char;
  const req=buildRequest(chat,charForReq,history);
  if(mode==="cont"){req.turns[req.turns.length-1].content+=`\n\n[Continue ${charForReq.name}'s last message exactly where it stopped. Do not repeat what was already written.]`}
  const ctrl=new AbortController();gen={chatId:chat.id,msgId:target.id,ctrl,start:Date.now()};
  renderMessages();renderComposer();
  const base=mode==="cont"?prev:"";
  try{
    const out=await callModel(req,txt=>{target.content=base+(mode==="cont"?" ":"")+txt;updateStreamingMsg(target)},ctrl.signal);
    target.content=(base?base+" ":"")+cleanOutput(out,req.charName,req.userName);
    if(!cleanOutput(out,req.charName,req.userName))throw new Error("The model returned an empty reply.");
  }catch(e){
    const aborted=e?.name==="AbortError"||ctrl.signal.aborted;
    if(aborted){if(target.content.trim()){target.content=target.content.trim()}else if(mode==="new"){chat.messages=chat.messages.filter(m=>m!==target)}else target.content=prev}
    else{
      if(mode==="new"&&!target.content.trim())chat.messages=chat.messages.filter(m=>m!==target);else if(mode!=="new"&&!target.content.trim())target.content=prev;
      if(e.message==="NO_KEY"){toast("Add an API key in Settings › Connection.",3500);settingsSheet("connection")}
      else toast("Couldn't get a reply: "+e.message,5000);
    }
  }finally{
    gen=null;chat.updated=Date.now();save();renderMessages(true);renderComposer();renderSidebar();
  }
}
function send(){
  if(gen){gen.ctrl.abort();return}
  const chat=getChat();if(!chat)return newChatSheet();
  const text=$("#input").value.trim();
  if(text){chat.messages.push({id:uid(),role:"user",content:text,ts:Date.now()});$("#input").value="";autoGrow()}
  chat.updated=Date.now();save();renderMessages();generate("new");
}

$("#msgInner").addEventListener("click",async e=>{

  const chat=getChat(),m=chat.messages.find(x=>x.id===msgEl.dataset.msg);if(!m)return;
  const act=e.target.closest("[data-act]")?.dataset.act;
  if(!act){if(e.target.closest(".bubble")&&!e.target.closest("textarea")){document.querySelectorAll(".msg.show-actions").forEach(x=>x!==msgEl&&x.classList.remove("show-actions"));msgEl.classList.toggle("show-actions")}return}
  if(gen&&act!=="copy"){toast("Wait for the reply to finish, or tap stop.");return}

  else if(act==="regen")generate("regen",m.id);

    const ta=col.querySelector("textarea");ta.style.height=Math.min(innerHeight*.6,ta.scrollHeight+8)+"px";ta.focus();
    col.querySelector('[data-edit="save"]').onclick=()=>{m.content=ta.value.trim()||m.content;m.edited=true;chat.updated=Date.now();save();renderMessages(true);renderSidebar()};

});

function drawSheet(){const top=sheetStack[sheetStack.length-1];if(!top)return closeSheet();
  $("#sheetTitle").textContent=top.title;$("#sheetBack").hidden=sheetStack.length<2;
  const tabsEl=$("#sheetTabs");tabsEl.hidden=!top.tabs;
  if(top.tabs){tabsEl.innerHTML=top.tabs.list.map(([k,l])=>`<button type="button" class="${k===top.tabs.cur?"on":""}" data-tab="${k}">${l}</button>`).join("");
    tabsEl.onclick=e=>{const k=e.target.closest("[data-tab]")?.dataset.tab;if(k){top.tabs.cur=k;drawSheet()}}}
  const body=$("#sheetBody");body.innerHTML="";top.render(body,top.tabs?.cur);body.scrollTop=0}
function closeSheet(){$("#sheet").hidden=true;sheetStack.length=0;renderAll()}
function sheetBackFn(){sheetStack.pop();if(sheetStack.length)drawSheet();else closeSheet()}

function swapSheet(){
  const chat=getChat();if(!chat)return;
  openSheet("Who speaks next",body=>{
    const inChat=chat.characterIds.map(getChar).filter(Boolean);const others=S.characters.filter(c=>!chat.characterIds.includes(c.id));
    body.innerHTML=`<div class="lbl">In this chat</div><div class="list">${inChat.map(c=>`<div class="li ${c.id===chat.activeCharId?"on":""}">${avHTML(c)}<button type="button" class="meta" data-pick="${c.id}" style="border:0;background:none;text-align:left;padding:0"><div class="t">${esc(c.name)}</div><div class="s">${c.id===chat.activeCharId?"Replying now":"Tap to make them reply"}</div></button>${inChat.length>1?`<button type="button" class="btn sm" data-rm="${c.id}">Remove</button>`:""}</div>`).join("")||'<div class="note">No characters in this chat.</div>'}</div>
      ${others.length?`<div class="lbl">Add to this chat</div><div class="list">${others.map(c=>`<button type="button" class="li" data-add="${c.id}">${avHTML(c,"sm")}<div class="meta"><div class="t">${esc(c.name)}</div></div><span class="pill">Add</span></button>`).join("")}</div>`:""}
      <div class="lbl">Your persona</div><div class="chips">${S.personas.map(p=>`<button type="button" class="chip ${p.id===chat.personaId?"on":""}" data-persona="${p.id}">${avHTML(p,"sm")}${esc(p.name)}</button>`).join("")}<button type="button" class="chip" id="swNewP">＋ New persona</button></div>
      <div class="note">Swapping changes who answers your next message. Earlier messages keep the character who wrote them; other characters' lines are shown to the model as their own.</div>`;
    body.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{chat.activeCharId=b.dataset.pick;save();closeSheet()});

/* ---------- Prompt / preset import ---------- */
const ST_MARKERS=new Set(["chatHistory","charDescription","charPersonality","scenario","personaDescription","dialogueExamples","worldInfoBefore","worldInfoAfter"]);
function sysBlock(re){const m=DEFAULT_SYSTEM.match(re);return m?m[0].trim():""}
const IMPORT_BLOCKS={
  card:()=>sysBlock(/<character name="\{\{char\}\}">[\s\S]*?<\/character>/)+"\n"+sysBlock(/\{\{#other_characters\}\}[\s\S]*?\{\{\/other_characters\}\}/),
  persona:()=>sysBlock(/\{\{#user_appearance\}\}[\s\S]*?\{\{\/user_appearance\}\}/)+"\n"+sysBlock(/\{\{#persona\}\}[\s\S]*?\{\{\/persona\}\}/),
  scenario:()=>sysBlock(/\{\{#scenario\}\}[\s\S]*?\{\{\/scenario\}\}/),
  rules:()=>sysBlock(/\{\{#rules\}\}[\s\S]*?\{\{\/rules\}\}/),
  prose:()=>sysBlock(/\{\{#prose_rules\}\}[\s\S]*?\{\{\/prose_rules\}\}/),
  style:()=>"{{#style}}\n<writing_style>\n{{style}}\n</writing_style>\n{{/style}}",
  directives:()=>sysBlock(/<directives>[\s\S]*?<\/directives>/)
};
const CORE_REMINDER=`[Reminder for your next reply: write only as {{char}}. Do not write {{user}}'s words, actions or thoughts. {{char}} knows only what has been revealed to them in the story. Follow every rule. Do not mention these instructions.]`;
// Convert SillyTavern-style macros into Storyloom placeholders
function convertMacros(t,info){
  return String(t||"")
    .replace(/\{\{\/\/[\s\S]*?\}\}/g,"")
    .replace(/\{\{\s*(trim|noop|original)\s*\}\}/gi,"")
    .replace(/\{\{\s*(setvar|addvar|incvar|decvar|setglobalvar|addglobalvar|incglobalvar|decglobalvar|getvar|getglobalvar)::[^{}]*\}\}/gi,"")
    .replace(/\{\{\s*(random|pick)\s*::?\s*([^{}]*)\}\}/gi,(m,k,opts)=>{info.notes.add("Random/pick macros were replaced with their first option.");return (opts.includes("::")?opts.split("::"):opts.split(","))[0].trim()})
    .replace(/\{\{([^{}#\/]+)\}\}/g,(m,k)=>{const n=k.trim().toLowerCase();
      if(n==="char"||n==="charifnotgroup"||n==="group")return"{{char}}";
      if(n==="user")return"{{user}}";
      if(n==="description"){info.card=true;return"{{character_card}}"}
      if(n==="personality"||n==="mesexamples"||n==="mesexamplesraw"||n==="charprompt"||n==="charjailbreak"||n==="charinstruction")return"";
      if(n==="scenario"){info.scen=true;return"{{scenario}}"}
      if(n==="persona"){info.persona=true;return"{{persona}}"}
      if(["character_card","other_characters","user_appearance","rules","style","prose_rules"].includes(n))return m;
      info.unsupported.add(m.length>40?m.slice(0,38)+"…}}":m);return m});
}
function parseImport(text,filename){
  let j;try{j=JSON.parse(text)}catch(e){
    const t=String(text||"").trim();if(!t)throw new Error("The file is empty.");
    j=t; // plain-text prompt
  }
  const info={notes:new Set(),unsupported:new Set(),parts:[],card:false,scen:false,persona:false};
  const baseName=(filename||"").replace(/\.(json|txt)$/i,"").replace(/\.storyloom-preset$/i,"");
  let r={format:"",name:baseName||"Imported preset",system:[],post:[],samplers:null,connection:null,storyloom:null};
  if(typeof j==="string"){r.format="Plain text prompt";r.system.push(convertMacros(j,info));info.parts.push({name:"Prompt text",where:"System prompt"})}
  else if(j&&j.storyloom_preset){r.format="Storyloom preset";r.storyloom=j;r.name=j.name||r.name;
    if(j.settings&&j.settings.model)r.connection=j.settings}
  else if(j&&Array.isArray(j.prompts)){
    const isST=j.prompts.some(p=>p&&p.identifier);
    r.format=isST?"SillyTavern chat preset":"Prompt list";if(j.name)r.name=j.name;
    const byId=Object.fromEntries(j.prompts.filter(p=>p&&p.identifier).map(p=>[p.identifier,p]));
    let order=null;
    if(isST&&Array.isArray(j.prompt_order)&&j.prompt_order.length){const po=j.prompt_order.find(o=>o.character_id===100001)||j.prompt_order[0];order=po.order}
    if(!order)order=j.prompts.map((p,i)=>({identifier:p.identifier||("#"+i),enabled:p.enabled!==false,_p:p}));
    let post=false,roleNote=false;
    for(const o of order){
      const pr=o._p||byId[o.identifier];const name=pr?.name||o.identifier;
      if(!pr&&!ST_MARKERS.has(o.identifier))continue;
      if(o.enabled===false){info.parts.push({name,where:"Off (not imported)"});continue}
      const id=o.identifier;
      if(ST_MARKERS.has(id)||pr?.marker){
        if(id==="chatHistory"){post=true;info.parts.push({name:"Chat history",where:"Chat goes here"});continue}
        if(post){info.parts.push({name,where:"Skipped (only supported before chat history)"});continue}
        if(id==="charDescription"||((id==="charPersonality"||id==="dialogueExamples")&&!info.card)){if(!info.card){r.system.push("§CARD§");info.card=true}info.parts.push({name,where:"Character sheet"});continue}
        if(id==="charPersonality"||id==="dialogueExamples"){info.parts.push({name,where:"Included in character sheet"});continue}
        if(id==="scenario"){r.system.push("§SCEN§");info.scen=true;info.parts.push({name,where:"Scenario"});continue}
        if(id==="personaDescription"){r.system.push("§PERSONA§");info.persona=true;info.parts.push({name,where:"Your persona"});continue}
        if(id.startsWith("worldInfo")){info.notes.add("World info (lorebooks) isn't supported, so those slots were skipped.");info.parts.push({name,where:"Skipped (lorebooks not supported)"});continue}
        continue;
      }
      const txt=convertMacros(pr.content,info).trim();
      if(!txt){info.parts.push({name,where:"Empty"});continue}
      if(pr.role&&pr.role!=="system"&&!roleNote){info.notes.add("Prompts set to the user or assistant role were merged into the system prompt.");roleNote=true}
      (post?r.post:r.system).push(txt);info.parts.push({name,where:post?"Reminder (after chat)":"System prompt"});
    }
    if(j.assistant_prefill)info.notes.add("Assistant prefill isn't supported and was skipped.");
    if(isST||j.temperature!==undefined){
      const sm={};if(typeof j.temperature==="number")sm.temperature=j.temperature;
      if(j.openai_max_tokens)sm.maxTokens=+j.openai_max_tokens;
      if(typeof j.top_p==="number"&&j.top_p<1)sm.topP=String(j.top_p);
      if(j.frequency_penalty)sm.freqPen=String(j.frequency_penalty);
      if(j.presence_penalty)sm.presPen=String(j.presence_penalty);
      if(j.reasoning_effort){const m={low:"low",medium:"medium",high:"high",min:"low",minimum:"low",max:"high",maximum:"high"}[String(j.reasoning_effort).toLowerCase()];if(m)sm.reasoning=m}
      const ex=[];if(j.top_k>0)ex.push("top_k");if(j.min_p>0)ex.push("min_p");if(j.repetition_penalty&&j.repetition_penalty!==1)ex.push("repetition_penalty");
      if(ex.length)info.notes.add(`The file also sets ${ex.join(", ")}. These weren't applied because many providers reject them. Add them under Connection › More sampling settings › Extra request parameters if yours accepts them.`);
      if(Object.keys(sm).length)r.samplers=sm;
    }
  }
  else if(j&&typeof j==="object"){
    const key=["content","system_prompt","systemPrompt","system","main_prompt","prompt","instructions","text"].find(k=>typeof j[k]==="string"&&j[k].trim());
    if(key){r.format=j.story_string!==undefined?"Prompt":"System prompt";if(j.name)r.name=j.name;r.system.push(convertMacros(j[key],info));info.parts.push({name:key,where:"System prompt"});
      const ph=["post_history","post_history_instructions","postHistory"].find(k=>typeof j[k]==="string"&&j[k].trim());
      if(ph){r.post.push(convertMacros(j[ph],info));info.parts.push({name:ph,where:"Reminder (after chat)"})}}
    else if(j.temp!==undefined||j.rep_pen!==undefined||j.genamt!==undefined){
      r.format="Sampler settings only";r.samplers={};if(typeof j.temp==="number")r.samplers.temperature=j.temp;if(j.genamt)r.samplers.maxTokens=+j.genamt;if(typeof j.top_p==="number"&&j.top_p<1)r.samplers.topP=String(j.top_p);
      info.notes.add("This file has no prompts, only sampler settings. The new preset copies your current prompts.");
    }
    else throw new Error(`Couldn't find a prompt in this file. Its top-level fields are: ${Object.keys(j).slice(0,12).join(", ")||"(none)"}.`);
  }
  else throw new Error("Couldn't read a prompt from this file.");
  r.info=info;return r;
}
function buildImportedPrompts(r,opt){
  if(r.storyloom)return fixPrompts({...clone(S.prompts),...clone(r.storyloom.prompts||{})});
  if(r.format==="Sampler settings only")return clone(S.prompts);
  const B=IMPORT_BLOCKS,i=r.info;
  let parts=r.system.map(x=>x==="§CARD§"?B.card():x==="§SCEN§"?B.scenario():x==="§PERSONA§"?B.persona():x);
  const lead=[];
  if(!i.card){lead.push(B.card())}
  parts=[...lead,...parts];
  if(!i.persona)parts.push(B.persona());
  if(!i.scen)parts.push(B.scenario());
  parts.push(B.rules());
  if(opt.addCore)parts.push(B.directives());
  parts.push(B.prose(),B.style());
  const system=parts.filter(Boolean).join("\n\n").replace(/\n{3,}/g,"\n\n");
  const reminder=[...r.post,opt.addCore?CORE_REMINDER:""].filter(Boolean).join("\n\n");
  return{system,reminder,rules:S.prompts.rules,style:opt.keepStyle?S.prompts.style:"",prose:opt.keepStyle?S.prompts.prose:""};
}

    <div class="section-title">Reset</div>
    <button type="button" class="btn danger" id="dReset">Erase all data</button>`;
  const doExport=withKey=>{syncPreset();const data=clone(S);if(!withKey){data.settings.apiKey="";(data.presets||[]).forEach(p=>{if(p.settings)p.settings.apiKey=""})}const txt=JSON.stringify(data);
    if(HAS_CLAUDE){claude.use("downloads").then(d=>d&&d.save({filename:`storyloom-backup-${new Date().toISOString().slice(0,10)}.json`,data:txt})).catch(()=>{})}
    else try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=`storyloom-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove()}catch(e){}
    $("#dOut").innerHTML=`<div class="field"><label>If no file downloaded, copy this text and keep it somewhere safe:</label><textarea class="tall" id="dOutTxt" readonly></textarea><button type="button" class="btn sm" id="dCopy">Copy</button></div>`;
    $("#dOutTxt").value=txt;$("#dCopy").onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast("Copied")}catch(e){$("#dOutTxt").select();toast("Select all and copy")}}};
  $("#dExp").onclick=()=>doExport(true);$("#dExpNoKey").onclick=()=>doExport(false);
  const restore=async txt=>{try{const d=JSON.parse(txt);if(!d.chats||!d.characters)throw 0;if(!await confirmDlg("Replace everything on this device with this backup?","Restore"))return;
    S=migrate(d);save();applyTheme();closeSheet();toast("Backup restored")}catch(e){toast("That doesn't look like a Storyloom backup.")}};
  $("#dImp").onclick=()=>restore($("#dPaste").value);
  $("#dFile").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept="application/json,.json,text/plain";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(f)};i.click()};
  $("#dReset").onclick=async()=>{if(await confirmDlg("Erase every chat, character, persona and setting? Export a backup first if you might want them.","Erase")){S=migrate(defaultState());save();applyTheme();closeSheet();toast("Reset")}};
}

/* =====================================================================
   WIRING
   ===================================================================== */
function openDrawer(){$("#sidebar").classList.add("open");$("#scrim").classList.add("show");if(IS_NATIVE)history.pushState({drawer:1},"")}
function closeDrawer(){$("#sidebar").classList.remove("open");$("#scrim").classList.remove("show")}
$("#menuBtn").onclick=openDrawer;$("#scrim").onclick=closeDrawer;
$("#newChatBtn").onclick=()=>{closeDrawer();newChatSheet()};
$("#chatSearch").oninput=renderSidebar;
$("#chatList").onclick=e=>{const b=e.target.closest("[data-chat]");if(!b)return;S.activeChatId=b.dataset.chat;save();closeDrawer();renderAll()};
document.querySelectorAll(".sb-nav [data-open]").forEach(b=>b.onclick=()=>{closeDrawer();({characters:charactersSheet,personas:personasSheet,settings:()=>settingsSheet()})[b.dataset.open]()});
$("#swapBtn").onclick=swapSheet;$("#chatSettingsBtn").onclick=chatSettingsSheet;$("#titleBox").onclick=()=>getChat()?chatSettingsSheet():newChatSheet();
$("#sendBtn").onclick=send;
function autoGrow(){const i=$("#input");i.style.height="auto";i.style.height=Math.min(i.scrollHeight,innerHeight*.4)+"px"}
$("#input").addEventListener("input",autoGrow);
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&S.settings.enterSends&&!e.isComposing){e.preventDefault();send()}});
// Android back button: close the top layer instead of leaving the app
window.addEventListener("popstate",()=>{if(!$("#confirmBox").hidden){$("#confirmNo").click();return}if(!$("#sheet").hidden){sheetStack.length>1?sheetBackFn():closeSheet();return}closeDrawer()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#sheet").hidden)closeSheet();else closeDrawer()}});

(async function init(){
  await Store.open();
  let saved=null;try{saved=JSON.parse(await Store.get("state")||"null")}catch(e){}
  S=migrate(saved||defaultState());
  try{navigator.storage?.persist?.()}catch(e){}
  applyTheme();renderAll();
  if(!Store.ok)toast("Storage is unavailable, so nothing will be saved. Export a backup from Settings › Data.",5000);
  if(!saved)save();
})();
</script>
