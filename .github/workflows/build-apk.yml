name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Create Android project
        run: |
          mkdir app && cd app
          npm init -y > /dev/null
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/app@7 @capacitor/cli@7
          mkdir www && cp ../index.html www/index.html
          echo '{"appId":"app.storyloom.rp","appName":"Storyloom","webDir":"www","server":{"androidScheme":"https","cleartext":true}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          pip install pillow -q
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import math
          def make(n, fg=False, rnd=False):
              S=n*4; im=Image.new('RGBA',(S,S)); d=ImageDraw.Draw(im)
              if not fg:
                  (d.ellipse if rnd else lambda b,fill: d.rounded_rectangle(b,radius=S//5,fill=fill))([0,0,S-1,S-1],fill='#16131d')
              r=S*(0.22 if fg else 0.34)
              d.polygon([(S/2+(r if i%2==0 else r*.38)*math.cos(math.pi/8*i-math.pi/2), S/2+(r if i%2==0 else r*.38)*math.sin(math.pi/8*i-math.pi/2)) for i in range(16)], fill='#c9a46a')
              return im.resize((n,n), Image.LANCZOS)
          for k,n in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              p=f'app/android/app/src/main/res/mipmap-{k}/'
              make(n).save(p+'ic_launcher.png'); make(n,rnd=True).save(p+'ic_launcher_round.png')
              make(int(n*108/48),fg=True).save(p+'ic_launcher_foreground.png')
          PY
          sed -i 's/#[0-9A-Fa-f]\{6\}/#16131d/' app/android/app/src/main/res/values/ic_launcher_background.xml
      - name: Build APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Storyloom-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
